# Drivy CI — S11 / T6
#
# Runner is macOS because the app is iOS-native (S3): the Xcode project is
# generated by XcodeGen from `project.yml` and is never committed, so every job
# starts with `xcodegen generate`.
#
# Runner image (S2 / L4): both jobs use the stable `macos-26` image and its
# default Xcode 26.6 toolchain, so no `DEVELOPER_DIR` is pinned anywhere. That
# toolchain ships the iOS 26 SDK, which is what App Store Connect requires for
# uploads and what compiles the `#available(iOS 26, *)` code paths of the app.
# The simulator device name below is checked against the image before the tests
# run, so an image rotation fails with the real device list instead of an
# opaque destination error.
#
# Jobs:
#   test         — runs on every PR (and on main / manual dispatch):
#                  `xcodegen generate` + `xcodebuild test` on an iPhone
#                  simulator. Simulator builds need no Apple Developer team.
#   build-release— runs only on `main` (and manual dispatch): generates the
#                  project, archives Release for `generic/platform=iOS`, exports
#                  a signed .ipa and uploads it to TestFlight. If the App Store
#                  Connect secrets are absent (forks, early state) the same job
#                  falls back to an unsigned Release build.
#
# SIGNED PIPELINE (implemented, S11 / T8):
#   `DEVELOPMENT_TEAM` stays unset in `project.yml` on purpose (simulator builds
#   need no team); the team is injected by the workflow instead. Repository
#   secrets consumed here (Settings → Secrets and variables → Actions):
#     APP_STORE_CONNECT_API_KEY_ID       key id of the ASC API key (10 chars)
#     APP_STORE_CONNECT_API_ISSUER_ID    issuer id of that key (UUID)
#     APP_STORE_CONNECT_API_KEY_BASE64   base64 of AuthKey_<KEYID>.p8
#     SENTRY_AUTH_TOKEN                  Sentry auth token for the dSYM upload
#                                        (optional: without it step 6 warns and
#                                        skips)
#   The Apple Developer team id (QP5A6D4Y4P) is public and hardcoded in the job
#   env. No .p12 or .mobileprovision secret is needed: the Apple Distribution
#   certificate and the App Store provisioning profile are created on the fly
#   through the App Store Connect REST API by
#   `.github/scripts/provision-signing.sh`, and the archive signs manually with
#   exactly that identity and profile.
#
#   Steps, in order:
#     1. decode the .p8 to $HOME/private_keys/AuthKey_<KEYID>.p8 (chmod 600,
#        path masked, never echoed) — the location `altool` and the
#        provisioning script look in;
#     2. (no separate key check: the provisioning script's first ASC API
#        call fails loudly on a bad Key ID / Issuer ID / key);
#     3. provision signing material via the ASC API: mint an ES256 JWT signed
#        with the .p8, ensure the App ID `com.acrstudio.drivy` exists, enable
#        its Sign in with Apple capability, create an Apple Distribution
#        certificate from a fresh EC P-256 CSR, export cert+key as a .p12 with
#        a random password into a temporary job keychain, then create and
#        install an IOS_APP_STORE profile for bundle id + certificate. Exact
#        endpoints and the DER→raw JWT signature conversion live in the script
#        header; nothing is ever revoked or deleted in the portal;
#     4. `xcodebuild archive` (Release, generic/platform=iOS) with MANUAL
#        signing: DEVELOPMENT_TEAM plus the per-target DRIVY_CODE_SIGN_STYLE,
#        DRIVY_CODE_SIGN_IDENTITY (SHA-1 of the profile's certificate) and
#        DRIVY_PROFILE_SPECIFIER="<profile name>" (see project.yml);
#     5. `xcodebuild -exportArchive` with an inline exportOptions.plist
#        (method app-store, teamID, signingStyle manual, signingCertificate,
#        provisioningProfiles, uploadSymbols);
#     6. (S5) upload the archive's dSYMs to Sentry so Release crashes are
#        symbolicated. Needs the SENTRY_AUTH_TOKEN secret; without it the step
#        prints a warning and exits 0, so a missing token never fails the build.
#        (S8 / F-01) sentry-cli comes from a pinned, checksum-verified release
#        asset, never from `curl | bash`;
#     7. `xcrun altool --upload-app -t ios` against TestFlight. A failing upload
#        fails the job and prints the last 80 lines of the altool log (S8 /
#        F-05): the log is never dumped in full to a public run;
#     8. the temporary job keychain is deleted.
#
#   Why manual signing: automatic cloud signing failed on this team with
#   "Your team has no devices from which to generate a provisioning profile"
#   plus "No profiles for 'com.acrstudio.drivy' were found: … iOS App
#   Development provisioning profiles", because the team had no distribution
#   certificate and Xcode fell back to development provisioning. The archive
#   therefore must not rely on `-allowProvisioningUpdates` any more: identity
#   and profile are handed in explicitly by the provisioning step.
#
#   Deliberate limitation: the certificate private key exists only on the
#   runner, so a distribution certificate created by an earlier run cannot be
#   reused by a later one. The provisioning script stops with an explicit error
#   in that case and revokes nothing — the way out is a human decision (revoke
#   the old certificate in the portal, or add the .p12 as a repository secret
#   and add a reuse fast path).
#
#   Fallback guard: the three secrets reach the job through `env` because the
#   `secrets` context cannot be used in an `if:` expression. A `Resolve signing
#   mode` step tests them for emptiness and publishes `signed=true|false`; the
#   signed steps run only on `true`, the unsigned build only otherwise, and the
#   run summary says which path ran and why.
#
#   The Sign in with Apple capability (S10) is now enabled on the App ID by the
#   provisioning script, so the manual Apple Developer portal step documented
#   as an L7 risk is gone.
#
# Keep this file in sync with the CI section of `.github/PULL_REQUEST_TEMPLATE.md`.

name: CI

on:
  # Any PR runs the test job, including the stacked PRs of the chained
  # strategy (L8), which may target an intermediate branch rather than main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous run; runs on main are never cancelled
# so the release-build evidence stays attached to the commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCHEME: Drivy
  XCODEPROJ: Drivy.xcodeproj
  # Device type present on the macos-26 images (iPhone 17 family, iOS 26.x
  # runtimes). The test job verifies the name against
  # `xcrun simctl list devices available` before running, so if a runner image
  # rotation ever drops this name the failing step prints every device it does
  # have.
  SIMULATOR_NAME: iPhone 17
  # Homebrew is only used to install XcodeGen; skip the self-update noise.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  test:
    name: Generate project and run tests (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      # `project.yml` is the source of truth; the .xcodeproj is gitignored.
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          # Fails fast if the scheme (S14) or the test target is missing from
          # the generated project, before the slow build starts.
          xcodebuild -list -project "$XCODEPROJ"
          xcodebuild -list -json -project "$XCODEPROJ" > "$RUNNER_TEMP/project.json"
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json, sys
          project = json.load(open(sys.argv[1]))["project"]
          assert "Drivy" in project["schemes"], project["schemes"]
          missing = {"Drivy", "DrivyTests"} - set(project["targets"])
          assert not missing, f"missing targets: {sorted(missing)}"
          print("schemes:", project["schemes"])
          print("targets:", project["targets"])
          PY

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Guard against a runner image rotation: `SIMULATOR_NAME` is a device of
      # the iOS 26.x runtimes shipped with Xcode 26.6, and `xcodebuild test`
      # below fails with an opaque "Unable to find a device matching" error when
      # the name is gone. Printing both lists makes the fix obvious.
      - name: Verify simulator destination is available
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -showdestinations || true
          devices="$(xcrun simctl list devices available)"
          printf '%s\n' "$devices"
          if ! printf '%s\n' "$devices" | grep -qE "^[[:space:]]*${SIMULATOR_NAME} \\("; then
            echo "::error::No simulator named '$SIMULATOR_NAME' on this image. Pick a device from the list above (it must be on an iOS 26 runtime) and update SIMULATOR_NAME in .github/workflows/ci.yml."
            exit 1
          fi
          echo "Simulator '$SIMULATOR_NAME' is available."

      # S11: tests on an iPhone simulator for every PR. Simulator builds are
      # ad-hoc signed, so no Apple Developer team/secret is needed here.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -resultBundlePath TestResults/Drivy-tests.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            TestResults/
            ${{ env.XCODEPROJ }}
          retention-days: 7
          if-no-files-found: ignore

  build-release:
    name: Signed TestFlight archive + upload (main only)
    # S11: the release build belongs to `main` only, never to a PR.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # Archive + export + upload; App Store Connect processing itself is
    # asynchronous and is not waited for by this job.
    timeout-minutes: 60
    env:
      # App Store Connect rejects uploads built with an SDK older than iOS 26,
      # which the macos-26 image default toolchain (Xcode 26.6) provides. No
      # `DEVELOPER_DIR` pin: the image default is the supported one, and pinning
      # an older Xcode is what kept this job on an obsolete SDK.
      # Public Apple Developer team id (S14 / L5) — not a secret.
      APPLE_TEAM_ID: "QP5A6D4Y4P"
      # Identity of the app in the developer portal; consumed by the
      # provisioning script and by the export options below.
      BUNDLE_ID: com.acrstudio.drivy
      APP_NAME: Drivy
      # Name of the App Store provisioning profile created on demand. Xcode
      # resolves it through PROVISIONING_PROFILE_SPECIFIER, so it must stay
      # exactly the name registered in the portal.
      PROFILE_NAME: Drivy App Store CI
      # Repository secrets, surfaced as env vars only so the fallback guard can
      # test them with a shell `-n`: `secrets` is not available to `if:`.
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project "$XCODEPROJ"
          xcodebuild -list -json -project "$XCODEPROJ" > "$RUNNER_TEMP/project.json"
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json, sys
          project = json.load(open(sys.argv[1]))["project"]
          assert "Drivy" in project["schemes"], project["schemes"]
          print("schemes:", project["schemes"])
          PY

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Fallback guard (S11): forks and early states have no App Store Connect
      # secrets. Only emptiness is tested here — no value is ever printed — and
      # the result decides which build path runs below.
      - name: Resolve signing mode
        id: signing
        run: |
          set -o pipefail
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_API_ISSUER_ID"
          [ -n "$ASC_KEY_BASE64" ] || missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets present: signed archive + TestFlight upload."
            exit 0
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Apple secrets missing:$missing — falling back to an unsigned Release build."
          {
            echo "### Signed TestFlight path skipped"
            echo ""
            echo "Missing repository secrets:$missing"
            echo ""
            echo "This run used the unsigned Release build fallback instead."
          } >> "$GITHUB_STEP_SUMMARY"

      # Installs the .p8 at ~/private_keys/, the path altool expects and the
      # path the provisioning script signs the ASC JWT from. The path and file
      # name are masked, and the base64 blob is masked by GitHub as a secret;
      # neither is echoed.
      - name: Install App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail
          key_dir="$HOME/private_keys"
          key_name="AuthKey_${ASC_KEY_ID}.p8"
          key_path="$key_dir/$key_name"
          echo "::add-mask::$key_path"
          echo "::add-mask::$key_name"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          # The secret may hold either the base64 of the .p8 file or the raw
          # PEM text itself — accept both instead of failing on a paste detail.
          if printf '%s' "$ASC_KEY_BASE64" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_BASE64" > "$key_path"
          else
            # -D is the macOS/BSD spelling; --decode is kept as a portability net.
            if ! printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path" 2>/dev/null; then
              printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key_path"
            fi
          fi
          chmod 600 "$key_path"
          if [ ! -s "$key_path" ]; then
            echo "::error::Decoded API key is empty — check APP_STORE_CONNECT_API_KEY_BASE64."
            exit 1
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::Decoded APP_STORE_CONNECT_API_KEY_BASE64 is not a .p8 PEM file."
            exit 1
          fi
          echo "App Store Connect API key installed at the masked path."

      # Imports the team's existing Apple Distribution identity (H69DS6A3KZ,
      # the same .p12 ProofMate signs with) into a temporary keychain. The
      # provisioning script below finds its private key there and reuses the
      # certificate instead of trying to create a new one.
      - name: Import distribution identity (.p12)
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DIST_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/dist-signing.keychain-db"
          keychain_pass="$(openssl rand -hex 24)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
          # shellcheck disable=SC2086 # one argument per keychain
          security list-keychains -d user -s "$keychain" $existing
          echo "IMPORTED_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      # Creates the Apple Distribution certificate (with its private key) and
      # the App Store provisioning profile through the App Store Connect API,
      # installs them on the runner, and exports PROFILE_NAME (read by the
      # archive/export steps) and SIGNING_KEYCHAIN_PATH (read by the cleanup
      # step). See the script header for the exact endpoints; it prints only
      # resource ids and expiries, never a key, password or JWT.
      - name: Provision signing material via ASC API
        if: steps.signing.outputs.signed == 'true'
        run: bash .github/scripts/provision-signing.sh

      # Manual signing (T8): the identity and the profile come from the previous
      # step, so this must NOT use CODE_SIGN_STYLE=Automatic or
      # -allowProvisioningUpdates — that cloud fallback is exactly what failed
      # with "Your team has no devices from which to generate a provisioning
      # profile". The ASC API key is not passed here at all: nothing in archive
      # or export needs it once signing is manual.
      - name: Archive and export signed IPA
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail

          # Both team certificates are named "Apple Distribution: Albert
          # Castellvi (QP5A6D4Y4P)" and the shared .p12 holds both, so the
          # identity is pinned by the SHA-1 of the certificate the profile was
          # bound to (SIGNING_IDENTITY, from the provisioning step), not by name.
          identity="${SIGNING_IDENTITY:-}"
          if [ -z "$identity" ]; then
            echo "::error::SIGNING_IDENTITY was not exported by the provisioning step."
            exit 1
          fi
          echo "Signing with identity $identity."

          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Drivy.xcarchive \
            -derivedDataPath build/DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DRIVY_CODE_SIGN_STYLE=Manual \
            DRIVY_CODE_SIGN_IDENTITY="$identity" \
            DRIVY_PROFILE_SPECIFIER="$PROFILE_NAME"

          # exportOptions are inline on purpose: no signing material is ever
          # committed. `app-store` is the legacy spelling of the App Store
          # Connect method; it is kept because the signed upload path (T8) was
          # validated with it. `signingStyle` manual plus `provisioningProfiles`
          # pins the .ipa to the profile the provisioning step just installed.
          mkdir -p build
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${identity}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Drivy.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/export

          # `|| true`: the runner's shell is `bash -e`, so an empty match must
          # not abort before the readable ::error:: below.
          ipa="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$ipa" ]; then
            echo "::error::Export produced no .ipa under build/export"
            find build/export -maxdepth 2 || true
            exit 1
          fi
          echo "Exported: $ipa"
          du -sh "$ipa"

      # S5: a Release crash is only readable when the dSYMs of that exact build
      # reach Sentry. Optional on purpose — a missing or expired token must not
      # block the TestFlight upload — so the step is continue-on-error and also
      # exits 0 by itself when the secret is empty.
      - name: Upload dSYMs to Sentry
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # (S8 / F-01) sentry-cli is installed from a pinned, checksum-verified
          # release. Never `curl | bash` here: this step runs in the job that
          # holds the App Store Connect .p8 and the distribution keychain, so a
          # third party must not be able to choose which code runs.
          #
          # To update both values:
          #   gh release view --repo getsentry/sentry-cli --json tagName
          #   gh api repos/getsentry/sentry-cli/releases/tags/<tag> \
          #     --jq '.assets[] | select(.name=="sentry-cli-Darwin-universal") | .digest'
          # (or download the asset once and run
          #  `shasum -a 256 sentry-cli-Darwin-universal`).
          SENTRY_CLI_VERSION: "3.8.2"
          SENTRY_CLI_SHA256: "2d1b118fa46960ba5e8e0cca9a6e197366905776a0ddc5a89c7d05a3908b77db"
        run: |
          set -o pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not set; skipping dSYM upload"
            exit 0
          fi
          cli="$RUNNER_TEMP/sentry-cli"
          url="https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal"
          echo "Installing sentry-cli $SENTRY_CLI_VERSION from $url"
          # --fail: a 404 must not be written to disk as if it were the binary.
          # A download outage only costs symbolication, so it skips the step like
          # a missing token does; a checksum mismatch below is a security failure
          # and stops the job.
          if ! curl -sSL --fail -o "$cli" "$url"; then
            echo "::warning::sentry-cli download failed ($url); skipping dSYM upload"
            exit 0
          fi
          if ! printf '%s  %s\n' "$SENTRY_CLI_SHA256" "$cli" | shasum -a 256 -c -; then
            echo "::error::sentry-cli checksum mismatch against $url — refusing to run an unverified binary"
            exit 1
          fi
          chmod +x "$cli"
          "$cli" --version
          "$cli" debug-files upload \
            --org acr-studio \
            --project drivy \
            --include-sources \
            build/Drivy.xcarchive/dSYMs

      # altool is still Apple's supported CLI upload path for iOS binaries with
      # an App Store Connect API key. Any failure here — including Apple-side
      # processing rejections — fails the job and prints the tail of the log.
      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail
          ipa="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa to upload"
            exit 1
          fi
          log="$RUNNER_TEMP/altool-upload.log"
          echo "Uploading $(basename "$ipa") to TestFlight (log: $log)"
          if xcrun altool --upload-app \
              -f "$ipa" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" > "$log" 2>&1; then
            tail -n 20 "$log"
            # Non-fatal cross-check: altool's exit code is the gate, but a
            # success with no known success marker is worth a visible warning.
            if ! grep -Eq 'No errors uploading|UPLOAD SUCCEEDED' "$log"; then
              echo "::warning::altool exited 0 but printed no known success marker — check the log above."
            fi
          else
            status=$?
            echo "::error::TestFlight upload failed (altool exit $status). Last 80 log lines follow."
            # Bounded on purpose (S8 / F-05): GitHub masking matches stored
            # values exactly, so an unbounded dump of a log that ever derives a
            # credential would publish it to a public run log.
            tail -n 80 "$log"
            exit "$status"
          fi
          {
            echo "### Uploaded to TestFlight"
            echo ""
            echo "Binary: \`$(basename "$ipa")\`"
            echo ""
            echo "Apple's processing is asynchronous: the build appears in App"
            echo "Store Connect → TestFlight once processing finishes."
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner is ephemeral anyway; dropping the keychain keeps the private
      # key out of any later artifact glob and out of the user search list.
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail
          for keychain in "${SIGNING_KEYCHAIN_PATH:-$RUNNER_TEMP/drivy-signing/Drivy-signing.keychain-db}" \
                          "$RUNNER_TEMP/dist-signing.keychain-db"; do
            if [ -f "$keychain" ]; then
              security delete-keychain "$keychain" || true
              echo "Deleted temporary signing keychain $(basename "$keychain")."
            fi
          done
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$profiles_dir" ]; then
            ls -1 "$profiles_dir"
          fi

      - name: Report signed artifacts
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail
          ARCHIVE=build/Drivy.xcarchive
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ ! -d "$ARCHIVE" ] || [ -z "$IPA" ]; then
            echo "::error::Missing signed artifacts (archive: $ARCHIVE, ipa: ${IPA:-none})"
            find build -maxdepth 2 || true
            exit 1
          fi
          echo "Archive: $ARCHIVE"
          echo "IPA: $IPA"
          du -sh "$ARCHIVE" "$IPA"

      # Fallback path (S11): without signing secrets the job still builds the
      # same Release configuration for a generic iOS device with signing
      # disabled. That catches device-only compile/optimizer failures without
      # pretending to be a TestFlight build.
      - name: Build Release for generic iOS device (unsigned fallback)
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Report unsigned fallback artifacts
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -o pipefail
          PRODUCTS=build/DerivedData/Build/Products/Release-iphoneos
          APP="$(find "$PRODUCTS" -maxdepth 1 -name 'Drivy.app' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then
            echo "::error::Release build produced no Drivy.app under $PRODUCTS"
            find "$PRODUCTS" -maxdepth 2 || true
            exit 1
          fi
          echo "Built: $APP"
          du -sh "$APP"
          {
            echo "### Unsigned Release build OK (TestFlight path skipped)"
            echo ""
            echo "The signed archive + upload did not run because at least one of"
            echo "\`APP_STORE_CONNECT_API_KEY_ID\`,"
            echo "\`APP_STORE_CONNECT_API_ISSUER_ID\` or"
            echo "\`APP_STORE_CONNECT_API_KEY_BASE64\` is empty in this repository."
            echo "Configure them to enable the TestFlight upload; see the header"
            echo "of \`.github/workflows/ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
