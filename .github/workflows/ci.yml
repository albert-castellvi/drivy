# Drivy CI — S11 / T6
#
# Runner is macOS because the app is iOS-native (S3): the Xcode project is
# generated by XcodeGen from `project.yml` and is never committed, so every job
# starts with `xcodegen generate`.
#
# Jobs:
#   test         — runs on every PR (and on main / manual dispatch):
#                  `xcodegen generate` + `xcodebuild test` on an iPhone
#                  simulator. Simulator builds need no Apple Developer team.
#   build-release— runs only on `main` (and manual dispatch): unsigned
#                  Release build for a generic iOS device, i.e. the exact
#                  compile the TestFlight archive will use once signing is
#                  available.
#
# SIGNING / TESTFLIGHT TODO (open, needs a human with App Store Connect
# access — no repository secrets exist yet):
#   `build-main` cannot produce a signed archive because `DEVELOPMENT_TEAM` is
#   intentionally unset in `project.yml`. To turn this into a real TestFlight
#   pipeline the repo needs these secrets:
#     APPLE_TEAM_ID                  Apple Developer team id (10 chars)
#     APPLE_CERTIFICATE_P12_BASE64   "Apple Distribution" cert, base64 p12
#     APPLE_CERTIFICATE_PASSWORD     password of that p12
#     APPLE_PROVISIONING_PROFILE_BASE64  App Store profile for
#                                        com.acrstudio.drivy (S14 / L5)
#     APP_STORE_CONNECT_API_KEY_ID   App Store Connect API key (upload)
#     APP_STORE_CONNECT_API_ISSUER_ID
#     APP_STORE_CONNECT_API_KEY_BASE64
#   With those in place the step that replaces the unsigned build is:
#     xcodebuild archive -project Drivy.xcodeproj -scheme Drivy \
#       -configuration Release -destination 'generic/platform=iOS' \
#       -archivePath build/Drivy.xcarchive \
#       DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
#       CODE_SIGN_STYLE=Automatic OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"
#     xcodebuild -exportArchive -archivePath build/Drivy.xcarchive \
#       -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export
#     xcrun altool --upload-app -f build/export/Drivy.ipa --apiKey "$KEY_ID" \
#       --apiIssuer "$ISSUER_ID"
#   Note the same Sign in with Apple capability (S10) must also be enabled on
#   the App ID in the Apple Developer portal, not only in project.yml (L7 risk).
#
# Keep this file in sync with the CI section of `.github/PULL_REQUEST_TEMPLATE.md`.

name: CI

on:
  # Any PR runs the test job, including the stacked PRs of the chained
  # strategy (L8), which may target an intermediate branch rather than main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous run; runs on main are never cancelled
# so the release-build evidence stays attached to the commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCHEME: Drivy
  XCODEPROJ: Drivy.xcodeproj
  # Device type present on the macos-15 images (iPhone 16 family, iOS 18.x).
  # The job logs `xcodebuild -showdestinations` first, so if a runner image
  # rotation ever drops this name the failing step says which names exist.
  SIMULATOR_NAME: iPhone 16
  # Homebrew is only used to install XcodeGen; skip the self-update noise.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  test:
    name: Generate project and run tests (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      # `project.yml` is the source of truth; the .xcodeproj is gitignored.
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          # Fails fast if the scheme (S14) or the test target is missing from
          # the generated project, before the slow build starts.
          xcodebuild -list -project "$XCODEPROJ"
          xcodebuild -list -json -project "$XCODEPROJ" > "$RUNNER_TEMP/project.json"
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json, sys
          project = json.load(open(sys.argv[1]))["project"]
          assert "Drivy" in project["schemes"], project["schemes"]
          missing = {"Drivy", "DrivyTests"} - set(project["targets"])
          assert not missing, f"missing targets: {sorted(missing)}"
          print("schemes:", project["schemes"])
          print("targets:", project["targets"])
          PY

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Show available simulators for the chosen destination
        run: |
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -showdestinations || true

      # S11: tests on an iPhone simulator for every PR. Simulator builds are
      # ad-hoc signed, so no Apple Developer team/secret is needed here.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -resultBundlePath TestResults/Drivy-tests.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            ${{ env.XCODEPROJ }}
          retention-days: 7
          if-no-files-found: ignore

  build-release:
    name: Unsigned Release build (main only)
    # S11: the release build belongs to `main` only, never to a PR.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project "$XCODEPROJ"
          xcodebuild -list -json -project "$XCODEPROJ" > "$RUNNER_TEMP/project.json"
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json, sys
          project = json.load(open(sys.argv[1]))["project"]
          assert "Drivy" in project["schemes"], project["schemes"]
          print("schemes:", project["schemes"])
          PY

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # S11 asks for a Release archive signed with Apple Developer secrets. No
      # secrets exist yet, so this builds the same Release configuration for a
      # generic iOS device with signing disabled. That catches device-only
      # compile/optimizer failures without pretending to be a TestFlight build.
      - name: Build Release for generic iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Report build products and signing TODO
        run: |
          set -o pipefail
          PRODUCTS=build/DerivedData/Build/Products/Release-iphoneos
          APP="$(find "$PRODUCTS" -maxdepth 1 -name 'Drivy.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Release build produced no Drivy.app under $PRODUCTS"
            find "$PRODUCTS" -maxdepth 2 || true
            exit 1
          fi
          echo "Built: $APP"
          du -sh "$APP"
          {
            echo "### Unsigned Release build OK"
            echo ""
            echo "Signed TestFlight archive is **still pending**: it needs Apple"
            echo "Developer secrets that do not exist in this repository yet."
            echo "See the TODO block at the top of \`.github/workflows/ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
