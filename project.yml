# Drivy — XcodeGen project spec.
#
# The .xcodeproj is generated, never committed: run `xcodegen generate` before
# building (CI does this on the macos-15 runner, see S11).
#
# Identity is fixed by the feature document (S14, L5): bundle id
# `com.acrstudio.drivy`, display name `Drivy`, scheme `Drivy`.

name: Drivy

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Pinned on purpose: the Sign in with Apple coordinator uses ASAuthorization
    # delegate callbacks, which are main-thread by contract. Complete checking /
    # Swift 6 mode would require nonisolated wrappers for them.
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # supabase-swift (S10): auth + Postgres client. Major version pinned.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Drivy:
    type: application
    platform: iOS
    sources:
      - path: Drivy
        excludes:
          # Declared through INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS below;
          # they must not be copied into the bundle as resources.
          - Resources/Info.plist
          - Resources/Drivy.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
    attributes:
      SystemCapabilities:
        # Sign in with Apple capability (S10: Apple requires it for social login).
        com.apple.SignInWithApple:
          enabled: true
    settings:
      base:
        PRODUCT_NAME: Drivy
        # Lowercase on purpose: matches L5/S14 and the App Store Connect record.
        PRODUCT_BUNDLE_IDENTIFIER: com.acrstudio.drivy
        INFOPLIST_FILE: Drivy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Drivy/Resources/Drivy.entitlements
    # DEVELOPMENT_TEAM is intentionally unset: simulator builds and tests need
    # no team, and CI injects the Apple Developer team for signed releases.

  DrivyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrivyTests
    dependencies:
      - target: Drivy
    settings:
      base:
        PRODUCT_NAME: DrivyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.acrstudio.drivy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drivy.app/Drivy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Drivy:
    build:
      targets:
        Drivy: all
        DrivyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: DrivyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
